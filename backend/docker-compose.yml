services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: montaudouce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # attend que la bdd soit lancée
      test: ["CMD-SHELL", "pg_isready -U user -d montaudouce"]
      interval: 2s
      timeout: 3s
      retries: 10

  # --------- A retirer ---------
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy # attend le check den haut
    environment:
      DATABASE_URL: postgres://user:password@db:5432/montaudouce
      CARGO_TARGET_DIR: /target # build hors du dossier monté (évite de polluer le mac)
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry # cache des crates téléchargées
      - cargo-target:/target # cache de compilation (sinon tout recompile à chaque up)
    ports:
      - "8000:8000"
    command: cargo watch -w src -w Cargo.toml -x run # recompile + relance à chaque modif

volumes:
  pgdata:
  cargo-registry:
  cargo-target: