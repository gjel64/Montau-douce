services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: montaudouce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # attend que la bdd soit lancée
      test: ["CMD-SHELL", "pg_isready -U user -d montaudouce"]
      interval: 2s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
      
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy # attend le check den haut
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/montaudouce
      PYTHONUNBUFFERED: 1 # affiche les print() dans les logs
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: