[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
poem = "3.1"                                              # framework web
tokio = { version = "1", features = ["full"] }            # runtime async (poem tourne dessus)
serde = { version = "1", features = ["derive"] }          # (dé)sérialisation JSON <-> struct
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono"] } # client Postgres async + pool
serde_json = "1.0"
argon2 = "0.6"                                            # hash des mots de passe
getrandom = "0.4"                                         # octets aléatoires de l'OS (tokens de session)
hex = "0.4"                                               # encodage hex des tokens
chrono = { version = "0.4", features = ["serde"] }        # dates (expiration des sessions)
